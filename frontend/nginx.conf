server {
    # Mismo puerto que usaba el servidor de desarrollo de Vite — así el túnel de Cloudflare
    # (configurado en el dashboard, no en este repo) sigue apuntando al mismo lugar sin tocar nada ahí.
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # El backend queda detrás de este mismo dominio, igual que hacía el proxy de Vite en desarrollo.
    # "^~" evita que la regla de caché de archivos estáticos (más abajo) le gane la prioridad a
    # esto — sin eso, una URL como /uploads/foto.jpg caía en esa regla de caché por la extensión
    # ".jpg" en vez de llegar al backend, y nginx la servía como 404 antes de siquiera proxyarla.
    location ^~ /api/ {
        # nginx por defecto solo deja pasar 1 MB de cuerpo — de sobra para JSON, pero cualquier
        # subida con varias fotos (PQR, lecturas, actas...) lo superaba y nginx la cortaba con un
        # 413 ANTES de que llegara al backend, sin que multer (que sí valida tamaño por archivo,
        # ver los distintos routers) llegara siquiera a verla. 100m cubre el peor caso real de la
        # app (actas: hasta 10 archivos de 10 MB cada uno).
        client_max_body_size 100m;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html (React Router maneja el resto).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea agresivamente los archivos con hash en el nombre (Vite les pone hash — son
    # inmutables); index.html y el manifest del PWA NO se cachean para que las actualizaciones
    # lleguen sin que el usuario tenga que forzar un refresh. Solo aplica a lo que sirve nginx
    # directamente desde disco (JS/CSS del build) — /uploads/ ya quedó resuelto arriba.
    location ~* \.(js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # El service worker y su registrador NO tienen hash en el nombre (a diferencia de
    # workbox-<hash>.js, que sí y por eso puede quedar en la regla de arriba) y el navegador los
    # vuelve a pedir en cada carga para detectar una versión nueva — pero la regla de ".js" de
    # arriba, por extensión, también los cacheaba 1 año como "immutable". Eso significaba que el
    # navegador nunca llegaba a enterarse de que había una versión nueva del service worker
    # (seguía sirviendo el viejo desde su propio caché interno indefinidamente), y la única forma
    # de ver los cambios era un hard refresh (que sí lo salta). Un "location" con "=" (coincidencia
    # exacta) le gana en prioridad a un regex sin importar el orden en el archivo, así que estos
    # si aplican de verdad aunque estén después del regex de arriba.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
